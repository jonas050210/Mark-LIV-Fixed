[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["dashboard/static/crypto-js.min.js"]

[tool.ruff.lint]
# Begin with correctness rules that should never be waived. Style and broad
# exception cleanup can be enabled module-by-module without hiding real errors.
select = ["E9", "F63", "F7", "F82", "B"]
ignore = [
  "B008", # FastAPI dependency descriptors are intentionally call defaults
  "B904", # provider adapters intentionally replace low-level network errors
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = [
  "B101", # assertions are used for internal invariants
  "B102", # action/plugin snapshots are validated trusted Python source
  "B104", # TLS dashboard intentionally serves authenticated LAN clients
  "B603", "B606", "B607", # argv-only native desktop integrations
]
