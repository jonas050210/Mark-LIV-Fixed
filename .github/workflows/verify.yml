name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install verification dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          "fastapi<1" "uvicorn<1" "cryptography<47"
          "python-multipart<1" "httpx<0.28" "coverage<8"
          "rapidfuzz<4" "PyQt6<7" "psutil<8"

      # The panel tests need a platform plugin. Without these the widget tests
      # skip, and a panel that fails to build would reach a user unnoticed.
      - name: Install Qt runtime dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0

      - name: Validate setup inputs
        run: python setup.py --check

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python .github/scripts/run_tests.py

      - name: Run overall verification
        env:
          QT_QPA_PLATFORM: offscreen
        run: python .github/scripts/run_overall.py --coverage

      # The Windows-only hardware checks are opt-in everywhere else; on a
      # Windows runner there is no reason not to run them.
      - name: Run Windows hardware integration suite
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python test_overall.py --windows
