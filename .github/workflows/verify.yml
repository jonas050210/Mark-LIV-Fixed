name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows / Python ${{ matrix.python }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PYTHONWARNINGS: "error::ResourceWarning"
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install Windows runtime and verification dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r requirements-dev.txt

      - name: Validate setup inputs
        run: python setup.py --check

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Check for definite Python errors
        run: ruff check .

      - name: Check for high-severity security findings
        run: bandit -r actions core dashboard memory plugins ui_panels main.py ui.py setup.py check_wake_word.py -q -lll

      - name: Audit installed verification dependencies
        run: pip-audit

      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python .github/scripts/run_tests.py

      - name: Run overall verification
        env:
          QT_QPA_PLATFORM: offscreen
        run: python .github/scripts/run_overall.py --coverage

      - name: Run Windows integration suite
        env:
          QT_QPA_PLATFORM: offscreen
          RUN_WINDOWS_INTEGRATION: "1"
        run: python -m unittest tests.test_windows_integration -v

      # The transcript is what makes a red Windows run diagnosable from here;
      # the hosted log API is not always readable after the fact.
      - name: Upload the verification report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-windows-py${{ matrix.python }}
          path: overall-report.json
          if-no-files-found: ignore
